apiVersion: v1
kind: Namespace
metadata:
  name: ipi-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipi-smoke
  namespace: ipi-smoke
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipi-smoke
  template:
    metadata:
      labels:
        app: ipi-smoke
    spec:
      containers:
        - name: web
          # Supply an approved digest for an arbitrary-UID Python 3 image with /tmp writable.
          image: registry.example.test/lab/python-web:replace-me
          command: [python3, -c]
          args:
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/health":
                          self.send_error(404)
                          return
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"openshift-ipi-ok\n")

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: ipi-smoke
  namespace: ipi-smoke
spec:
  selector:
    app: ipi-smoke
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ipi-smoke
  namespace: ipi-smoke
spec:
  host: ipi-smoke.apps.virt-lab.example.test
  to:
    kind: Service
    name: ipi-smoke
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
