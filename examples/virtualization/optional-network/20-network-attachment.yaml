apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: guest-vlan
  namespace: virt-smoke
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br-guest
spec:
  # Site-specific VLAN 120. Guest/approved external DHCP provides IP addressing.
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "guest-vlan",
      "type": "bridge",
      "bridge": "br-guest",
      "vlan": 120,
      "macspoofchk": true,
      "disableContainerInterface": true
    }
